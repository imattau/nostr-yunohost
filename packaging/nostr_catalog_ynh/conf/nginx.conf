location __PATH__/ {
  proxy_pass http://127.0.0.1:__PORT_ADMIN__/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # See cmd/nostr-catalogd/admin.go: SSOwat's admins-only permission
  # (resources.permissions.main in manifest.toml) is the primary access
  # control here; the admin page's own CSRF check is defense in depth on
  # top of it, not a substitute for it.
}
