name: Publish YunoHost app to Nostr
description: Sign and publish a YunoHost package declaration to Nostr relays
inputs:
  relays:
    description: Comma-separated Nostr relay URLs
    required: true
  private-key:
    description: Dedicated Nostr publishing key (hex)
    required: true
  repository:
    description: Package repository path
    required: false
    default: .
  nostr-yunohost-version:
    description: nostr-yunohost module version or Git ref to install
    required: false
    default: main
  announce:
    description: >-
      Also publish a kind-1 text note announcing this release (see
      docs/profile-and-announcements.md). A local ledger keyed by
      app_id/commit prevents re-announcing an unchanged revision, so this
      can safely be left "true" for every run.
    required: false
    default: 'false'
  announcement-ledger:
    description: >-
      Path to the local announcement ledger, required when announce is
      true. Must persist across workflow runs (e.g. actions/cache) or every
      run will re-announce - a plain job-local path defeats the dedup.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.24'
    - name: Publish signed declaration
      shell: bash
      env:
        NOSTR_YNH_PRIVATE_KEY: ${{ inputs.private-key }}
        NOSTR_YNH_RELAYS: ${{ inputs.relays }}
        ANNOUNCE: ${{ inputs.announce }}
        ANNOUNCEMENT_LEDGER: ${{ inputs.announcement-ledger }}
      run: |
        set -euo pipefail
        go install "github.com/imattau/nostr-yunohost/cmd/nostr-ynh@${{ inputs.nostr-yunohost-version }}"
        args=(publish --repo "${{ inputs.repository }}")
        if [ "$ANNOUNCE" = "true" ]; then
          args+=(--announce --announcement-ledger "$ANNOUNCEMENT_LEDGER")
        fi
        "$(go env GOPATH)/bin/nostr-ynh" "${args[@]}"
